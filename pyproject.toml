[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-heal"
version = "1.0.0"
description = "A lightweight, robust probe-timer self-healing watchdog for systemd services with ntfy alerts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dalton Rosenberg" }
]
keywords = ["systemd", "watchdog", "self-healing", "auto-restart", "health-check", "monitoring", "ntfy", "homelab", "vps", "devops", "sysadmin", "linux"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/digitaldesignsfl/sentinel-heal"
Source = "https://github.com/digitaldesignsfl/sentinel-heal"
Issues = "https://github.com/digitaldesignsfl/sentinel-heal/issues"

[project.scripts]
sentinel-heal = "sentinel_heal:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
