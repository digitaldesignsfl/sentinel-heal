[heal]
dry_run = 1                 ; 1 = log DRY_RUN rows, never restart. Flip to 0 after 48 h.
interval_s = 60             ; informational; timer owns cadence. Used for strike spacing (min_strike_gap_s = interval_s - 10).
strikes = 2                 ; consecutive DOWN runs before acting
probe_timeout_s = 5         ; connect+read timeout per probe; a frozen process hits this -> DOWN
min_active_s = 180          ; skip if unit entered active less than this many seconds ago
min_uptime_s = 300          ; skip everything if system uptime below this
busy_max_age_s = 1800       ; /run/sentinel/busy older than this is stale and ignored
hold_units = sentinel-ops.service ; while any listed unit is active/activating, skip ALL targets (broker restarting the agent)
cap_hour = 3                ; restart attempts per unit per rolling 3600 s (TIMEOUT/FAILED count; DRY_RUN only while dry; CAPPED never)
cap_day = 6                 ; restarts per unit per rolling 86400 s
poll_s = 2                  ; restart job poll interval
restart_timeout_grace_s = 10 ; added to TimeoutStopUSec+TimeoutStartUSec read from systemd
log_path = /var/log/sentinel-heal/heal.jsonl
status_path = /var/lib/sentinel-heal/status.json
run_dir = /run/sentinel-heal
notify_conf = /etc/sentinel-heal/notify.conf ; 0600; keys NTFY_URL, NTFY_TOKEN (optional). Absent = log-only AND live restarts blocked (dry_run forced). Never logged.
notify_repeat_s = 3600      ; same (unit,event) not re-sent within this window

[target:sentinel-agent]
unit = sentinel-agent.service
probe = http://127.0.0.1:3000/health
post_restart_wait_s = 15,30,45 ; poll to a 90 s bound: ExecStartPre waits up to 60 s for tailscale (sol M-02)
requires_iface = tailscale0  ; skip if this iface has no 100.x address (restart cannot succeed)
busy_marker = /run/sentinel/busy  ; long in-process tasks; the agent refreshes it every 300 s while busy

[target:ollama]
unit = ollama.service
probe = http://127.0.0.1:11434/api/version
post_restart_wait_s = 15,45  ; second sample if first is not OK (cold start)

[target:nginx]
unit = nginx.service
probe = http://127.0.0.1:80/        ; recon: returns 404 (162 bytes). Any status < 500 is OK (§6); no special file needed
post_restart_wait_s = 15
